name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Classify pull request scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if [[ -z "$CHANGED" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$CHANGED"
          NON_DOC="$(printf '%s\n' "$CHANGED" | grep -vE '^(\.github/pull_request_template\.md|AGENTS\.md|CLAUDE\.md|LESSONS\.md|README.*\.md|CHANGELOG\.md|CONTRIBUTING\.md|LICENSE|docs/|site/|assets/)' || true)"
          if [[ -n "$NON_DOC" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install recycle-bin support
        run: sudo apt-get update && sudo apt-get install -y trash-cli
      - run: npm ci
      - run: npm run test:infra
      - if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
        run: npm run audit:runtime
      - if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
        run: npm run verify
      - uses: actions/upload-artifact@v7.0.2
        if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true')
        with:
          name: tests-linux
          path: artifacts/tests/**

  desktop-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:infra
      - run: npm run ci:run -- run typecheck
      - run: npm test
      - run: npm run ci:run -- run build -w @bridge/protocol
      - name: Build Windows installer with empty optional release variables
        run: npm run ci:run -- run make:windows -w @bridge/desktop
        env:
          BRIDGE_RELAY_URL: ""
          BRIDGE_PUBLIC_RELAY_URL: ""
          BRIDGE_PAIRING_BASE_URL: ""
          BRIDGE_SERVICE_ORIGIN: ""
          BRIDGE_ICE_SERVERS: ""
      - run: npm run ci:run -- run build -w @bridge/relay
      - name: Run packaged Windows QA and pairing
        run: npm run ci:run -- run test:desktop:packaged:windows
      - name: Assert Windows installer output
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "apps/desktop/out/make" -Recurse -Filter "*Setup.exe" | Select-Object -First 1
          if ($null -eq $setup) { throw "Assisted NSIS Setup.exe was not produced" }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Bridge-Windows-installer-ci
          path: |
            apps/desktop/out/make/**
            artifacts/packaged-desktop/**
            artifacts/tests/**

  desktop-linux:
    if: github.event_name != 'pull_request'
    # Forge's RPM maker expects the RPM 4.18 build layout shipped by this LTS.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install recycle-bin and RPM/DEB toolchains
        run: sudo apt-get update && sudo apt-get install -y trash-cli rpm fakeroot dpkg
      - run: npm ci
      - run: npm run ci:run -- run typecheck
      - run: npm test
      - run: npm run ci:run -- run build -w @bridge/protocol
      - name: Build Linux installers with empty optional release variables
        run: npm run ci:run -- run make:linux -w @bridge/desktop
        env:
          BRIDGE_RELAY_URL: ""
          BRIDGE_PUBLIC_RELAY_URL: ""
          BRIDGE_PAIRING_BASE_URL: ""
          BRIDGE_SERVICE_ORIGIN: ""
          BRIDGE_ICE_SERVERS: ""
      - name: Assert Linux installer outputs
        shell: bash
        run: |
          set -euo pipefail
          make_dir="apps/desktop/out/make"
          find "$make_dir" -name "*.deb" -print -quit | grep -q . || { echo "Missing .deb output"; exit 1; }
          find "$make_dir" -name "*.rpm" -print -quit | grep -q . || { echo "Missing .rpm output"; exit 1; }
          find "$make_dir" -name "*.zip" -print -quit | grep -q . || { echo "Missing .zip output"; exit 1; }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Bridge-Linux-installers-ci
          path: |
            apps/desktop/out/make/**
            artifacts/tests/**

  android-debug:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install recycle-bin support
        run: sudo apt-get update && sudo apt-get install -y trash-cli
      - run: npm ci
      - run: npm run ci:run -- run build -w @bridge/protocol
      - run: npm run ci:run -- run sync -w @bridge/mobile
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - name: Assert Android APK debug signature is stable
        shell: bash
        run: |
          set -euo pipefail
          # 0.9.3 pinned the repo-shared debug key; catch signature drift at PR time.
          EXPECTED="8b4e8a0ed8e506dde6ff65f92b9bd526d2fcaf10d35089d381a02d9ed23a18db"
          APK="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(ls -v "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)"
          [ -n "${APKSIGNER:-}" ] || { echo "apksigner not found under ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"; exit 1; }
          OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)"
          ACTUAL="$(printf '%s\n' "$OUTPUT" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            printf '%s\n' "$OUTPUT"
            echo "Debug APK signature drifted: [$ACTUAL] (expected $EXPECTED)"
            exit 1
          fi
          echo "Android APK debug signature OK: $ACTUAL"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Bridge-Android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  macos-unit:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:infra
      - run: npm test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: tests-macos
          path: artifacts/tests/**

  browser-e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install recycle-bin support
        run: sudo apt-get update && sudo apt-get install -y trash-cli
      - run: npm ci
      - name: Install Chromium from the locked Playwright CLI
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-e2e
          path: artifacts/browser-e2e/**

  quality-gate:
    name: Quality gate
    if: always()
    needs: [changes, verify, desktop-windows, desktop-linux, android-debug, macos-unit, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Require every job to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.JOB_RESULTS);
            for (const [name, job] of Object.entries(jobs)) console.log(`${name}: ${job.result}`);
            const fullMatrix = ["changes", "verify", "desktop-windows", "desktop-linux", "android-debug", "macos-unit", "browser-e2e"];
            if (process.env.EVENT_NAME !== "pull_request") {
              if (fullMatrix.some((name) => jobs[name]?.result !== "success")) process.exit(1);
              process.exit(0);
            }
            const docsOnly = process.env.DOCS_ONLY === "true";
            const required = new Set(["changes", "verify"]);
            if (!docsOnly) required.add("browser-e2e");
            for (const name of fullMatrix) {
              const result = jobs[name]?.result;
              if (required.has(name)) {
                if (result !== "success") process.exit(1);
              } else if (result !== "skipped" && result !== "success") {
                process.exit(1);
              }
            }
          '
