name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install recycle-bin support
        run: sudo apt-get update && sudo apt-get install -y trash-cli
      - run: npm ci
      - run: npm run test:infra
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-linux
          path: artifacts/tests/**

  desktop-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:infra
      - run: npm run ci:run -- run typecheck
      - run: npm test
      - run: npm run ci:run -- run build -w @bridge/protocol
      - name: Build Windows installer with empty optional release variables
        run: npm run ci:run -- run make:windows -w @bridge/desktop
        env:
          BRIDGE_RELAY_URL: ""
          BRIDGE_PUBLIC_RELAY_URL: ""
          BRIDGE_PAIRING_BASE_URL: ""
          BRIDGE_SERVICE_ORIGIN: ""
          BRIDGE_ICE_SERVERS: ""
      - run: npm run ci:run -- run build -w @bridge/relay
      - name: Run packaged Windows QA and pairing
        run: npm run ci:run -- run test:desktop:packaged:windows
      - name: Assert Windows installer output
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "apps/desktop/out/make" -Recurse -Filter "*Setup.exe" | Select-Object -First 1
          if ($null -eq $setup) { throw "Assisted NSIS Setup.exe was not produced" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bridge-Windows-installer-ci
          path: |
            apps/desktop/out/make/**
            artifacts/packaged-desktop/**
            artifacts/tests/**

  desktop-linux:
    # Forge's RPM maker expects the RPM 4.18 build layout shipped by this LTS.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install recycle-bin and RPM/DEB toolchains
        run: sudo apt-get update && sudo apt-get install -y trash-cli rpm fakeroot dpkg
      - run: npm ci
      - run: npm run ci:run -- run typecheck
      - run: npm test
      - run: npm run ci:run -- run build -w @bridge/protocol
      - name: Build Linux installers with empty optional release variables
        run: npm run ci:run -- run make:linux -w @bridge/desktop
        env:
          BRIDGE_RELAY_URL: ""
          BRIDGE_PUBLIC_RELAY_URL: ""
          BRIDGE_PAIRING_BASE_URL: ""
          BRIDGE_SERVICE_ORIGIN: ""
          BRIDGE_ICE_SERVERS: ""
      - name: Assert Linux installer outputs
        shell: bash
        run: |
          set -euo pipefail
          make_dir="apps/desktop/out/make"
          find "$make_dir" -name "*.deb" -print -quit | grep -q . || { echo "Missing .deb output"; exit 1; }
          find "$make_dir" -name "*.rpm" -print -quit | grep -q . || { echo "Missing .rpm output"; exit 1; }
          find "$make_dir" -name "*.zip" -print -quit | grep -q . || { echo "Missing .zip output"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bridge-Linux-installers-ci
          path: |
            apps/desktop/out/make/**
            artifacts/tests/**

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install recycle-bin support
        run: sudo apt-get update && sudo apt-get install -y trash-cli
      - run: npm ci
      - run: npm run ci:run -- run build -w @bridge/protocol
      - run: npm run ci:run -- run sync -w @bridge/mobile
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - name: Assert Android APK debug signature is stable
        shell: bash
        run: |
          set -euo pipefail
          # 0.9.3 pinned the repo-shared debug key; catch signature drift at PR time.
          EXPECTED="8b4e8a0ed8e506dde6ff65f92b9bd526d2fcaf10d35089d381a02d9ed23a18db"
          APK="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(ls -v "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)"
          [ -n "${APKSIGNER:-}" ] || { echo "apksigner not found under ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"; exit 1; }
          OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)"
          ACTUAL="$(printf '%s\n' "$OUTPUT" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            printf '%s\n' "$OUTPUT"
            echo "Debug APK signature drifted: [$ACTUAL] (expected $EXPECTED)"
            exit 1
          fi
          echo "Android APK debug signature OK: $ACTUAL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bridge-Android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci:run -- run build -w @bridge/protocol
      - name: Build unsigned simulator app
        run: npm run ci:run -- run build:ios:simulator -w @bridge/mobile
      - name: Build unsigned device app
        run: npm run ci:run -- run build:ios:device -w @bridge/mobile
      - name: Assert iOS build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -d "apps/mobile/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app" \
            || { echo "Missing simulator App.app"; exit 1; }
          test -d "apps/mobile/ios/DerivedData-device/Build/Products/Debug-iphoneos/App.app" \
            || { echo "Missing unsigned device App.app"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bridge-iOS-simulator-ci
          path: apps/mobile/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bridge-iOS-device-unsigned-ci
          path: apps/mobile/ios/DerivedData-device/Build/Products/Debug-iphoneos/App.app

  macos-unit:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:infra
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-macos
          path: artifacts/tests/**

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install recycle-bin support
        run: sudo apt-get update && sudo apt-get install -y trash-cli
      - run: npm ci
      - name: Install Chromium from the locked Playwright CLI
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e
          path: artifacts/browser-e2e/**

  quality-gate:
    name: Quality gate
    if: always()
    needs: [verify, desktop-windows, desktop-linux, android-debug, ios, macos-unit, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.JOB_RESULTS); for (const [name, job] of Object.entries(jobs)) console.log(`${name}: ${job.result}`); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1);'
