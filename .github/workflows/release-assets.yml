name: Release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.9.0); leave empty for a build-only run
        required: false
        type: string
      revision:
        description: Full commit SHA that passed CI; required when publishing a release
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  statuses: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Resolve source and require successful CI before publication
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          REQUESTED_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          REVISION="$(git rev-parse HEAD)"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          if [[ -n "$TAG" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_REVISION" != "$REVISION" ]]; then
              echo "Publishing requires an explicit full commit SHA." >&2
              exit 1
            fi
            [[ "$TAG" == "v$(jq -er '.version' package.json)" ]]
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "$REVISION" refs/remotes/origin/main
            local_ok() {
              gh api "repos/$GITHUB_REPOSITORY/commits/$1/status?per_page=100" 2>/dev/null \
                | jq -e --arg rev "$1" '.sha == $rev and any(.statuses[]; .context == "ci/local-distributed" and .state == "success")' >/dev/null
            }
            online_ok() {
              gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
                --branch main --commit "$1" --status success --limit 20 \
                --json headSha,event,status,conclusion \
                | jq -e --arg rev "$1" 'any(.[]; .headSha == $rev and (.event == "push" or .event == "workflow_dispatch") and .status == "completed" and .conclusion == "success")' >/dev/null
            }
            if ! local_ok "$REVISION" && ! online_ok "$REVISION"; then
              echo "Commit $REVISION lacks verified ci/local-distributed status or completed main CI run." >&2
              exit 1
            fi
          fi

  desktop:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS
            make_command: npm run ci:run -- run make:adhoc -w @bridge/desktop
            artifact_suffix: adhoc
          - os: windows-2022
            name: Windows
            make_command: npm run ci:run -- run make:windows -w @bridge/desktop
            artifact_suffix: installer
          - os: ubuntu-24.04
            name: Linux
            make_command: npm run ci:run -- run make:linux -w @bridge/desktop
            artifact_suffix: installers
    runs-on: ${{ matrix.os }}
    env:
      BRIDGE_RELAY_URL: ${{ vars.BRIDGE_RELAY_URL }}
      BRIDGE_PAIRING_BASE_URL: ${{ vars.BRIDGE_PAIRING_BASE_URL }}
      BRIDGE_WIN_CERTIFICATE_BASE64: ${{ secrets.BRIDGE_WIN_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install recycle-bin and RPM/DEB toolchains
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y trash-cli rpm fakeroot dpkg
      - run: npm ci
      - run: npm run ci:run -- run typecheck
      - run: npm test
      - run: npm run ci:run -- run build -w @bridge/protocol
      - name: Prepare Windows Authenticode certificate
        if: matrix.os == 'windows-2022' && env.BRIDGE_WIN_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          BRIDGE_WIN_CERTIFICATE_BASE64: ${{ secrets.BRIDGE_WIN_CERTIFICATE_BASE64 }}
          BRIDGE_WIN_CERTIFICATE_PASSWORD: ${{ secrets.BRIDGE_WIN_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "bridge-signing.p12"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:BRIDGE_WIN_CERTIFICATE_BASE64))
          "BRIDGE_WIN_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BRIDGE_WIN_CERTIFICATE_PASSWORD=$env:BRIDGE_WIN_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: ${{ matrix.make_command }}
      - name: Build Relay for packaged Windows QA
        if: matrix.os == 'windows-2022'
        run: npm run build -w @bridge/relay
      - name: Run packaged Windows QA and pairing
        if: matrix.os == 'windows-2022'
        run: npm run ci:run -- run test:desktop:packaged:windows
      - name: Assert Windows installer output
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "apps/desktop/out/make" -Recurse -Filter "*Setup.exe" | Select-Object -First 1
          if ($null -eq $setup) { throw "Assisted NSIS Setup.exe was not produced" }
      - name: Record Windows hashes and Authenticode status
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "apps/desktop/out/make" -Recurse -Filter "*Setup.exe" | Select-Object -First 1
          $signature = Get-AuthenticodeSignature -FilePath $setup.FullName
          if ($env:BRIDGE_WIN_CERTIFICATE_BASE64 -ne '' -and $signature.Status -ne 'Valid') {
            throw "Signed Windows installer failed Authenticode validation: $($signature.Status)"
          }
          $evidence = [ordered]@{
            version = (Get-Content "apps/desktop/package.json" | ConvertFrom-Json).version
            installerType = "nsis-assisted"
            directorySelection = $true
            setup = $setup.FullName
            setupSha256 = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
            authenticode = $signature.Status.ToString()
            signer = if ($null -ne $signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
          }
          $evidence | ConvertTo-Json | Set-Content -Encoding utf8 "apps/desktop/out/make/windows-release-evidence.json"
      - name: Assert Linux installer outputs
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          make_dir="apps/desktop/out/make"
          find "$make_dir" -name "*.deb" -print -quit | grep -q . || { echo "Missing .deb output"; exit 1; }
          find "$make_dir" -name "*.rpm" -print -quit | grep -q . || { echo "Missing .rpm output"; exit 1; }
          find "$make_dir" -name "*.zip" -print -quit | grep -q . || { echo "Missing .zip output"; exit 1; }
      - name: Record Linux hashes
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop/out/make
          find . -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.zip" \) -print0 \
            | sort -z | xargs -0 shasum -a 256 > linux-release-evidence.sha256
      - name: Stage flat installer payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = "apps/desktop/out/release-payload"
          New-Item -ItemType Directory -Force $payload | Out-Null
          $keep = '.dmg', '.zip', '.exe', '.deb', '.rpm', '.json', '.sha256'
          Get-ChildItem "apps/desktop/out/make" -Recurse -File |
            Where-Object { $keep -contains $_.Extension.ToLowerInvariant() } |
            Copy-Item -Destination $payload
          if ((Get-ChildItem $payload).Count -eq 0) { throw "Installer payload is empty" }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Bridge-${{ matrix.name }}-${{ matrix.artifact_suffix }}-ci
          path: apps/desktop/out/release-payload/**
      - name: Upload packaged Windows QA evidence
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Bridge-Windows-qa-ci
          path: artifacts/packaged-desktop/**
          if-no-files-found: warn

  android:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install recycle-bin support
        run: sudo apt-get update && sudo apt-get install -y trash-cli
      - run: npm ci
      - run: npm run ci:run -- run build -w @bridge/protocol
      - run: npm run ci:run -- run sync -w @bridge/mobile
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - name: Assert Android APK output
        shell: bash
        run: |
          set -euo pipefail
          test -f "apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk" \
            || { echo "Missing debug APK"; exit 1; }
      - name: Verify all Android DEX files
        run: python3 -I scripts/verify-android-dex.py apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Assert Android APK debug signature is stable
        shell: bash
        run: |
          set -euo pipefail
          # 0.9.3 pinned the repo-shared debug key so every build (local and CI)
          # over-installs cleanly; fail the release if the signature ever drifts.
          EXPECTED="8b4e8a0ed8e506dde6ff65f92b9bd526d2fcaf10d35089d381a02d9ed23a18db"
          APK="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(ls -v "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)"
          [ -n "${APKSIGNER:-}" ] || { echo "apksigner not found under ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"; exit 1; }
          OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)"
          ACTUAL="$(printf '%s\n' "$OUTPUT" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            printf '%s\n' "$OUTPUT"
            echo "Debug APK signature drifted: [$ACTUAL] (expected $EXPECTED)"
            exit 1
          fi
          echo "Android APK debug signature OK: $ACTUAL"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Bridge-Android-debug-ci
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  publish:
    needs: [source, desktop, android]
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_REVISION: ${{ needs.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: Bridge-*
          path: packed
      - name: Stage platform assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.version' package.json)"
          mkdir -p assets
          (cd "packed/Bridge-macOS-adhoc-ci" && zip -qr "$OLDPWD/assets/Bridge-${version}-macos-adhoc.zip" .)
          (cd "packed/Bridge-Windows-installer-ci" && zip -qr "$OLDPWD/assets/Bridge-${version}-windows-installer-ci.zip" .)
          (cd "packed/Bridge-Linux-installers-ci" && zip -qr "$OLDPWD/assets/Bridge-${version}-linux-installers-ci.zip" .)
          cp "packed/Bridge-Android-debug-ci/app-debug.apk" "assets/Bridge-${version}-android-debug.apk"
          (cd assets && sha256sum Bridge-* > SHA256SUMS.txt)
          printf '%s\n' "$RELEASE_REVISION" > assets/SOURCE_COMMIT.txt
          ls -l assets
      - name: Generate release notes
        env:
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          LAST_TAG="$(
            git tag --merged "$RELEASE_REVISION" --sort=-version:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              grep -vxF "$TAG" |
              head -1 || true
          )"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          python3 -I - "$TAG" "$NOTES_FILE" <<'PY'
          from pathlib import Path
          import sys
          tag, target = sys.argv[1:]
          marker = f"## {tag.removeprefix('v')}\n"
          section = Path("CHANGELOG.md").read_text().split(marker, 1)[1].split("\n## ", 1)[0].strip()
          Path(target).write_text(section + "\n")
          PY
          printf '\nBuild commit: `%s`\n\nmacOS uses ad-hoc signing. Windows and Linux assets are CI builds; Windows Authenticode status is recorded in the included windows-release-evidence.json. Android uses the repository debug signing key.\n' "$RELEASE_REVISION" >> "$NOTES_FILE"
          if [[ -n "$LAST_TAG" ]]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$LAST_TAG" "$TAG" >> "$NOTES_FILE"
          fi
      - name: Publish GitHub Release with platform assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(assets/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No staged assets; refusing to publish an empty release."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" = "true" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_REVISION"
              gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
                --notes-file "$RUNNER_TEMP/release-notes.md"
            else
              echo "Release $TAG is already published (immutable); platform assets remain"
              echo "available as workflow artifacts on this run."
            fi
          else
            # Draft-first keeps asset uploads compatible with immutable
            # releases; the tag materializes when the draft is published.
            gh release create "$TAG" --draft --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_REVISION" \
              --title "Bridge $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
