name: Release

on:
  status:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: read

concurrency:
  group: bridge-release
  cancel-in-progress: false

env:
  RELEASE_REVISION: ${{ github.event.sha || github.event.workflow_run.head_sha || github.sha }}

jobs:
  check-version:
    if: >-
      (github.event_name == 'status' &&
       github.event.context == 'ci/local-distributed' &&
       github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_REVISION }}
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Require verified CI for release revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_REVISION" refs/remotes/origin/main
          local_ok() {
            gh api "repos/$GITHUB_REPOSITORY/commits/$1/status?per_page=100" 2>/dev/null \
              | jq -e --arg rev "$1" '.sha == $rev and any(.statuses[]; .context == "ci/local-distributed" and .state == "success")' >/dev/null
          }
          online_ok() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --commit "$1" --status success --limit 20 \
              --json headSha,event,status,conclusion \
              | jq -e --arg rev "$1" 'any(.[]; .headSha == $rev and (.event == "push" or .event == "workflow_dispatch") and .status == "completed" and .conclusion == "success")' >/dev/null
          }
          if ! local_ok "$RELEASE_REVISION" && ! online_ok "$RELEASE_REVISION"; then
            echo "Commit $RELEASE_REVISION lacks verified ci/local-distributed status or completed main CI run." >&2
            exit 1
          fi

      - name: Inspect release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(jq -er '.version | select(type == "string")' package.json)"
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $CURRENT_VERSION" >&2
            exit 1
          fi

          TAG="v${CURRENT_VERSION}"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)" == "false" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG is already published; skipping."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Creating or resuming draft $TAG at $RELEASE_REVISION."
          fi

      - name: Validate synchronized versions
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const releaseVersion = process.env.RELEASE_VERSION;
          const manifestFiles = [
            "package.json",
            "apps/client/package.json",
            "apps/desktop/package.json",
            "apps/mobile/package.json",
            "apps/relay/package.json",
            "packages/protocol/package.json",
          ];
          const failures = [];

          for (const file of manifestFiles) {
            const manifest = JSON.parse(readFileSync(file, "utf8"));
            if (manifest.version !== releaseVersion) {
              failures.push(`${file}: version ${manifest.version ?? "<missing>"}`);
            }
            for (const group of ["dependencies", "devDependencies", "peerDependencies"]) {
              for (const [name, version] of Object.entries(manifest[group] ?? {})) {
                if (name.startsWith("@bridge/") && version !== releaseVersion) {
                  failures.push(`${file}: ${group}.${name} ${version}`);
                }
              }
            }
          }

          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const lockPackages = [
            "",
            "apps/client",
            "apps/desktop",
            "apps/mobile",
            "apps/relay",
            "packages/protocol",
          ];
          for (const path of lockPackages) {
            const version = lock.packages?.[path]?.version;
            if (version !== releaseVersion) {
              failures.push(`package-lock.json packages[${JSON.stringify(path)}]: ${version ?? "<missing>"}`);
            }
          }

          const android = readFileSync("apps/mobile/android/app/build.gradle", "utf8");
          const androidVersion = android.match(/versionName\s+"([^"]+)"/u)?.[1];
          if (androidVersion !== releaseVersion) {
            failures.push(`Android versionName: ${androidVersion ?? "<missing>"}`);
          }

          const ios = readFileSync("apps/mobile/ios/App/App.xcodeproj/project.pbxproj", "utf8");
          const iosVersions = new Set(
            [...ios.matchAll(/MARKETING_VERSION = ([^;]+);/gu)].map((match) => match[1]?.trim()),
          );
          if (iosVersions.size !== 1 || !iosVersions.has(releaseVersion)) {
            failures.push(`iOS MARKETING_VERSION: ${[...iosVersions].join(", ") || "<missing>"}`);
          }

          if (failures.length > 0) {
            console.error(`Release version ${releaseVersion} is not synchronized:`);
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }

          console.log(`All release versions match ${releaseVersion}.`);
          NODE

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    steps:
      - name: Create or resume draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_REVISION"
          else
            gh release create "$TAG" --draft --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_REVISION" --title "Bridge $TAG" \
              --notes "Platform builds in progress; published automatically once all assets land."
          fi

      - name: Dispatch platform asset builds for the verified revision
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-assets.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f "tag=v${VERSION}" -f "revision=$RELEASE_REVISION"
