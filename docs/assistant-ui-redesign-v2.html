<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bridge v3 个人助理 UI 原型（严格复刻本体样式体系）</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* =========================================================================
       Verbatim Bridge v3 Design System Tokens & Layout Rules
       Extracted directly from:
       - apps/client/src/styles.css (Pure 2-Pane Flat Desktop, 740px stream, .interactive-prompt-card, .permission-dock, .evidence-panel, .composer-form)
       - apps/client/src/mobile.css (Cardless Hairline Upper Pages, .mobile-home-catalog.is-flat-tree, .m-header, .m-sheet)
       - apps/client/src/components/session/settings.css (.desktop-settings-shell, .settings-sections, .mobile-settings-row)
       - apps/client/src/components/assistant/assistant-mail.css (.assistant-mail-card hairline rows)
       Scoped on .b-app so host :root is untouched.
       ========================================================================= */

    .b-app {
      --font-sans: "DM Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-num: "Inter", "DM Sans", "PingFang SC", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --font-scale: 1;
      --r-btn: 7px;
      --r-card: 10px;
      --r-input: 14px;
      --m-gutter: 16px;
      --m-touch: 44px;
      --m-row: 54px;
      --m-r-control: 10px;
      --m-r-group: 14px;
      --m-r-sheet: 20px;
      --t-fast: 140ms;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

      /* Sunstone Light (styles.css:19-89 + 8776) */
      --bg: #f6f4f0;
      --sidebar-fill: #f2efe9;
      --surface: #ffffff;
      --surface-2: rgba(58, 44, 32, 0.045);
      --surface-3: rgba(58, 44, 32, 0.09);
      --composer-fill: #ffffff;
      --user-bubble: #ece7dc;
      --m-sheet-fill: #f6f4f0;
      --text: #231d16;
      --muted: #6d6053;
      --faint: #8d8071;
      --line: rgba(62, 47, 33, 0.12);
      --line-strong: rgba(62, 47, 33, 0.22);
      --clay: #d97757;
      --accent: var(--clay);
      --accent-soft: #f6e7de;
      --accent-ink: #a84d2e;
      --warm: #b07a24;
      --warm-soft: #f7ecd8;
      --warm-ink: #8a5f14;
      --danger: #c0392b;
      --danger-soft: #f9e5e1;
      --danger-ink: #a93226;
      --success: #788c5d;
      --success-ink: #5c6f45;
      --card-fill: #ffffff;
      --card-border: rgba(62, 47, 33, 0.09);
      --btn-primary-bg: #a84d2e;
      --btn-primary-hover: #93411f;
      --btn-primary-text: #ffffff;
      --scrim: rgba(46, 35, 25, 0.4);
      --composer-shadow: 0 8px 28px rgba(28, 25, 21, 0.06), 0 1px 3px rgba(28, 25, 21, 0.03);

      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line-strong);
      box-sizing: border-box;
    }

    /* Sunstone Dark (styles.css:96-151 + 8781 + mobile.css:28) */
    .b-app[data-theme="dark"] {
      --bg: #1b1a18;
      --sidebar-fill: #141311;
      --surface: #22211e;
      --surface-2: #2b2926;
      --surface-3: #35332f;
      --composer-fill: #23221f;
      --user-bubble: #2a2824;
      --m-sheet-fill: #23221f;
      --text: rgba(248, 246, 241, 0.94);
      --muted: rgba(242, 238, 230, 0.68);
      --faint: rgba(242, 238, 230, 0.56);
      --line: rgba(255, 255, 255, 0.09);
      --line-strong: rgba(255, 255, 255, 0.17);
      --clay: #e0885f;
      --accent: var(--clay);
      --accent-soft: rgba(224, 136, 95, 0.16);
      --accent-ink: #e5936c;
      --warm: #d9a45b;
      --warm-soft: rgba(197, 138, 46, 0.16);
      --warm-ink: #e2b067;
      --danger: #e57368;
      --danger-soft: rgba(192, 57, 43, 0.17);
      --danger-ink: #ef8479;
      --success: #93a878;
      --success-ink: #a2ba86;
      --card-fill: #22211e;
      --card-border: rgba(255, 255, 255, 0.09);
      --btn-primary-bg: #e0885f;
      --btn-primary-hover: #e99b77;
      --btn-primary-text: #241309;
      --scrim: rgba(0, 0, 0, 0.52);
      --composer-shadow: 0 10px 32px rgba(0, 0, 0, 0.38), 0 1px 3px rgba(0, 0, 0, 0.25);
    }

    /* Apple Light (styles.css:6570-6651 + 8787) */
    .b-app[data-theme-family="apple"][data-theme="light"] {
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      --bg: #f2f2f7;
      --sidebar-fill: #f4f4f6;
      --surface: #ffffff;
      --surface-2: rgba(118, 118, 128, 0.12);
      --surface-3: rgba(118, 118, 128, 0.2);
      --composer-fill: #ffffff;
      --user-bubble: #ebebf0;
      --m-sheet-fill: #f2f2f7;
      --text: #1d1d1f;
      --muted: #636366;
      --faint: #6b6b70;
      --line: rgba(60, 60, 67, 0.12);
      --line-strong: rgba(60, 60, 67, 0.24);
      --clay: #007aff;
      --accent: #007aff;
      --accent-soft: rgba(0, 122, 255, 0.1);
      --accent-ink: #0055b3;
      --warm: #ff9500;
      --warm-soft: rgba(255, 149, 0, 0.12);
      --warm-ink: #9a4a00;
      --danger: #ff3b30;
      --danger-soft: rgba(255, 59, 48, 0.1);
      --danger-ink: #d70015;
      --success: #34c759;
      --success-ink: #1e7b34;
      --card-fill: #ffffff;
      --card-border: rgba(60, 60, 67, 0.08);
      --btn-primary-bg: #0071e3;
      --btn-primary-hover: #0066d6;
      --btn-primary-text: #ffffff;
      --r-btn: 8px;
      --r-card: 13px;
      --scrim: rgba(0, 0, 0, 0.36);
    }

    /* Apple Dark (styles.css:6654-6710 + 8792) */
    .b-app[data-theme-family="apple"][data-theme="dark"] {
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      --bg: #1c1c1e;
      --sidebar-fill: #141416;
      --surface: #242426;
      --surface-2: #2f2f32;
      --surface-3: #3c3c40;
      --composer-fill: #242426;
      --user-bubble: #2c2c2e;
      --m-sheet-fill: #242426;
      --text: #f5f5f7;
      --muted: rgba(235, 235, 245, 0.68);
      --faint: rgba(235, 235, 245, 0.58);
      --line: rgba(84, 84, 88, 0.55);
      --line-strong: rgba(120, 120, 128, 0.7);
      --clay: #0a84ff;
      --accent: #0a84ff;
      --accent-soft: rgba(10, 132, 255, 0.16);
      --accent-ink: #52a8ff;
      --warm: #ff9f0a;
      --warm-soft: rgba(255, 159, 10, 0.14);
      --warm-ink: #ffb340;
      --danger: #ff453a;
      --danger-soft: rgba(255, 69, 58, 0.14);
      --danger-ink: #ff7b73;
      --success: #30d158;
      --success-ink: #38d962;
      --card-fill: #242426;
      --card-border: rgba(255, 255, 255, 0.07);
      --btn-primary-bg: #0a84ff;
      --btn-primary-hover: #2997ff;
      --btn-primary-text: #ffffff;
      --r-btn: 8px;
      --r-card: 13px;
      --scrim: rgba(0, 0, 0, 0.52);
    }

    .b-app *, .b-app *::before, .b-app *::after { box-sizing: border-box; }
    /* :where 保持零特异性，避免覆盖 .text-link-btn / .send-button 自己的字号与颜色 */
    :where(.b-app) :where(button, input, textarea, select) { font: inherit; color: inherit; }
    .b-app button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* 状态条：离线 / 会话不可用 / 需重新绑定 / 认证失败（复用 .permission-dock 的扁平横条几何） */
    .assistant-status-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 9px 12px;
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.5;
    }
    .assistant-status-line.is-warn { background: var(--warm-soft); color: var(--warm-ink); }
    .assistant-status-line.is-danger { background: var(--danger-soft); color: var(--danger-ink); }
    .assistant-status-line > span { flex: 1; min-width: 0; }
    .assistant-status-line .text-link-btn { color: inherit; font-weight: 650; }
    .mail-domain-mismatch { padding: 0 3px; border-radius: 4px; background: var(--danger-soft); color: var(--danger-ink); font-weight: 700; }
    .skeleton-line { height: 11px; border-radius: 6px; background: var(--surface-2); }
    .composer-form.is-disabled { opacity: 0.55; }

    /* ---- Pure 2-Pane Flat Desktop Layout (styles.css:8821-8997) ---- */
    .desktop-session-layout {
      display: grid;
      width: 100%;
      height: 680px;
      grid-template-columns: 260px minmax(0, 1fr);
      background: var(--bg);
    }
    .desktop-session-layout.is-sidebar-collapsed { grid-template-columns: minmax(0, 1fr); }

    .desktop-session-sidebar {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: var(--sidebar-fill);
    }
    .desktop-sidebar-heading {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px 6px 14px;
    }
    .m-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; display: inline-block; }
    .m-status-dot.is-online { background: var(--success); }

    .sidebar-assistant-row {
      display: flex;
      width: 100%;
      min-height: 34px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      font-size: 13px;
      font-weight: 560;
      cursor: pointer;
    }
    .sidebar-assistant-row:hover { background: color-mix(in srgb, var(--text) 5.5%, transparent); }
    .sidebar-assistant-row.active {
      background: color-mix(in srgb, var(--text) 8.5%, transparent);
      font-weight: 620;
    }
    .session-search {
      display: flex;
      min-height: 34px;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--text) 5.2%, transparent);
      color: var(--muted);
      font-size: 12.5px;
    }
    .flat-session-row {
      display: flex;
      width: 100%;
      min-height: 34px;
      align-items: center;
      padding: 6px 8px 6px 20px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      color: var(--text);
    }
    .flat-session-row:hover { background: color-mix(in srgb, var(--text) 5.5%, transparent); }
    .flat-session-row.active { background: color-mix(in srgb, var(--text) 8.5%, transparent); font-weight: 600; }

    /* ---- Single Unified Header (.m-header, styles.css:9503 + mobile.css:502) ---- */
    .m-header {
      display: flex;
      flex: none;
      min-height: 56px;
      align-items: center;
      gap: 6px;
      padding: 6px 8px 6px 4px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }
    .m-header.is-embedded {
      min-height: 52px;
      gap: 10px;
      padding: 0 18px 0 14px;
    }
    .m-header-copy { display: flex; flex: 1; min-width: 0; align-items: center; gap: 10px; }
    .m-header h1 { margin: 0; font-size: 15px; font-weight: 620; letter-spacing: -0.01em; white-space: nowrap; }
    .m-header.is-mobile h1 { font-size: 16.5px; font-weight: 650; }
    .m-host-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 7px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 12.5px;
      cursor: pointer;
    }
    .m-host-chip:hover { background: var(--surface-2); color: var(--text); }

    .icon-button {
      display: inline-grid;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      place-items: center;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .icon-button:hover, .icon-button.active { background: var(--surface-2); color: var(--text); }
    .m-header.is-mobile .icon-button { width: 40px; height: 40px; color: var(--text); }

    /* ---- Inline Compact Pill Switch (.desktop-session-view-switch, styles.css:9586) ---- */
    .view-switch {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border-radius: 8px;
      background: var(--surface-2);
    }
    .view-switch > button {
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 520;
      white-space: nowrap;
      cursor: pointer;
    }
    .view-switch > button:hover:not(.active) { color: var(--text); }
    .view-switch > button.active {
      background: var(--card-fill);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .view-switch > button > b {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
    }

    /* ---- Centered 740px Stream & Cardless Hairline Panels (styles.css:8094 + 9635) ---- */
    .centered-scroll-stage {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      background: var(--bg);
      padding: 18px max(24px, calc((100% - 740px) / 2)) 18px;
    }
    .centered-scroll-stage.is-mobile {
      padding: 14px 16px 20px;
    }

    /* Hairline Section Header & Flat 1px Hairline Rows (ZERO outer card boxes!) */
    .settings-hairline-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px 9px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .mobile-settings-row {
      padding: 14px 2px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
    }

    /* ---- Permission / Pending Proposal Dock Banner (styles.css:3135) ---- */
    .permission-dock-wrap { flex: none; padding: 10px max(24px, calc((100% - 740px) / 2)) 0; background: var(--bg); }
    .permission-dock-wrap.is-mobile { padding: 8px 16px 0; }
    .permission-dock {
      display: grid;
      width: 100%;
      min-height: 46px;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 7px 11px;
      border: 1px solid color-mix(in srgb, var(--warm) 36%, var(--line));
      border-radius: 9px;
      background: var(--warm-soft);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .permission-dock-icon {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 7px;
      background: color-mix(in srgb, var(--warm) 16%, transparent);
      color: var(--warm);
    }

    /* ---- Conversation Items: User Bubble, Mail Card, Interactive Proposal Card ---- */
    .conversation-bubble {
      max-width: min(80%, 560px);
      padding: 11px 16px;
      border: 0;
      border-radius: 18px;
      background: var(--user-bubble);
      color: var(--text);
      font-size: 14.5px;
      line-height: 1.55;
    }
    .assistant-prose {
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--text);
    }
    .is-mobile .assistant-prose, .is-mobile .conversation-bubble { font-size: 15.5px; }

    /* Inline Stream Card (styles.css:7627 .interactive-prompt-card) */
    .interactive-prompt-card {
      display: grid;
      gap: 10px;
      margin-top: 10px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      background: var(--surface);
    }
    .interactive-prompt-card.is-pending {
      border-color: color-mix(in srgb, var(--accent) 48%, var(--line));
      background: color-mix(in srgb, var(--accent-soft) 28%, var(--surface));
    }
    .interactive-prompt-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 650;
      background: var(--accent-soft);
      color: var(--accent-ink);
    }
    .interactive-prompt-badge.done {
      background: var(--surface-2);
      color: var(--muted);
    }

    /* Buttons (styles.css:284-332 + mobile.css:1693) */
    .primary-button, .secondary-button {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px 13px;
      border-radius: var(--r-btn);
      font-size: 13px;
      font-weight: 620;
      cursor: pointer;
    }
    .primary-button {
      border: 1px solid transparent;
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .primary-button:hover { background: var(--btn-primary-hover); }
    .secondary-button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
    }
    .secondary-button:hover { background: var(--surface-2); }

    .text-link-btn {
      padding: 2px 0;
      border: 0;
      background: transparent;
      color: var(--accent-ink);
      font-size: 13px;
      font-weight: 560;
      cursor: pointer;
    }
    .text-link-btn:hover { text-decoration: underline; }

    /* ---- Persistent Bottom Floating Composer (styles.css:8396-8765) ---- */
    .composer-wrap {
      flex: none;
      padding: 4px 24px 16px;
      background: var(--bg);
    }
    .composer-wrap.is-mobile { padding: 4px 14px 14px; }
    .composer-inner {
      width: 100%;
      max-width: 740px;
      margin: 0 auto;
      position: relative;
    }
    .composer-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px 9px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      background: var(--composer-fill);
      box-shadow: var(--composer-shadow);
    }
    .composer-attach-trigger {
      display: inline-grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 0;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      cursor: pointer;
    }
    .composer-attach-trigger:hover { background: var(--surface-3); color: var(--text); }
    .send-button {
      display: inline-grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--text);
      color: var(--bg);
      cursor: pointer;
    }
    .session-context-pill {
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 550;
    }

    /* Mail Reference Banner (assistant-mail.css:161) */
    .assistant-mail-reference {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      padding: 8px 12px;
      border-left: 3px solid var(--accent-ink);
      background: var(--surface);
      font-size: 12.5px;
    }

    /* ---- Mobile Layer-1 Home Session Catalog (mobile.css:79-490) ---- */
    .mobile-drawer-topbar {
      display: flex;
      min-height: 52px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px 6px 12px;
    }
    .drawer-host-switcher {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border: 0;
      border-radius: 9px;
      background: color-mix(in srgb, var(--text) 5.5%, transparent);
      font-size: 14.5px;
      font-weight: 620;
      cursor: pointer;
    }
    .drawer-assistant-capsule {
      display: inline-flex;
      flex: 1 1 auto;
      min-height: 38px;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-2);
      font-size: 14px;
      font-weight: 580;
      cursor: pointer;
    }

    /* ---- Desktop 2-Column Flat Settings Shell (settings.css:34-108) ---- */
    .desktop-settings-shell {
      display: grid;
      width: min(100%, 820px);
      margin: 0 auto;
      grid-template-columns: 148px minmax(0, 1fr);
      gap: 32px;
      align-items: start;
    }
    .settings-sections button {
      display: flex;
      width: 100%;
      min-height: 34px;
      align-items: center;
      padding: 7px 11px;
      border: 0;
      border-radius: 8px;
      background: transparent;

    function syncDock() {
      const want = (() => {
        if (!pendings().length || !canCommit()) return false;
        if (S.vp === "mobile" && S.mobileScreen !== "assistant") return false;
        if (S.view === "mail" || S.view === "agenda") return true;

        const box = stage.getBoundingClientRect();
        return ![...stage.querySelectorAll(".interactive-prompt-card.is-pending")].some(el => {

          return r.bottom > box.top + 24 && r.top < box.bottom - 24;

      const dock = document.getElementById("pending-dock");

          date: "2026-11-18",
          dueTime: "10:00",
          listSource: "提醒事项",
          notes: ref ? `关联邮件《${ref.subject}》` : "",
          meta: "提醒事项" + (ref ? ` · 关联《${ref.subject.slice(0, 10)}…》` : ""),
          warning: null,
          body: "截止提醒：2026-11-18 10:00" + (ref ? `\n备注：关联邮件《${ref.subject}》` : ""),
          rev: 1,
          state: "pending"
        });
        S.stream.push({ kind: "assistant", text: "要加这条待办吗？", proposalIds: [pid] });
      }
      S.draftText = ""; S.mailRef = null; S.uploads = [];
      if (S.view !== "conversation") S.view = "conversation";
      draw();
    }

    function primaryCommitLabel(p) {
      if (p.kind === "mail") return "核对并发送…";
      if (p.kind === "calendar") return "确认写入日历";
      return "确认添加待办";
    }

    function refineButtonLabel(p) {
      if (p.kind === "mail") return "让助理润色";
      if (p.kind === "calendar") return "让助理重排";
      return "让助理调整";
    }

    function requestCommitProp(id) {
      const p = S.proposals.find(x => x.id === id);
      if (!p || p.state !== "pending" || !canCommit()) return;
      // 邮件发送属于不可撤回外部动作，强制走二次核对确认抽屉
      if (p.kind === "mail") {
        S.confirmSendPropId = id;
        draw();
        return;
      }
      executeCommitProp(id);
    }

    function executeCommitProp(id) {
      const p = S.proposals.find(x => x.id === id);
      if (!p || p.state !== "pending") return;
      p.state = "executed";
      S.confirmSendPropId = null;
      if (p.kind === "calendar") {
        S.events.splice(1, 0, {
          id: "e-" + Date.now(),
          time: `${p.date || "周四"} ${p.startTime || "14:00"} – ${p.endTime || "14:45"}`,
          title: p.eventTitle || "合作协议终稿核对（陈明）",
          meta: `${p.calendarSource || "Apple 日历"} · 已写入`
        });
      }
      draw();
    }

    function buildManualDraft(p) {
      if (p.kind === "mail") {
        return { to: p.to || "", subject: p.subject || "", body: p.body || "" };
      }
      if (p.kind === "calendar") {
        return {
          eventTitle: p.eventTitle || p.title.replace(/^新增日程：/, ""),
          date: p.date || "2026-11-19",
          startTime: p.startTime || "14:00",
          endTime: p.endTime || "14:45",
          calendarSource: p.calendarSource || "Apple 日历",
          location: p.location || "线上会议",
          notes: p.notes || ""
        };
      }
      return {
        todoTitle: p.todoTitle || p.title.replace(/^新建待办：/, ""),
        date: p.date || "2026-11-18",
        dueTime: p.dueTime || "10:00",
        listSource: p.listSource || "提醒事项",
        notes: p.notes || ""
      };
    }

    function focusActivePropInput() {
      setTimeout(() => {
        const el = document.getElementById(S.editMode === "ai" ? "prop-ai-ta" : "prop-manual-ta");
        if (el) {
          el.focus();
          el.selectionStart = el.selectionEnd = el.value.length;
        }
      }, 20);
    }

    function openPropEdit(id, mode = "ai") {
      const p = S.proposals.find(x => x.id === id);
      if (!p) return;
      S.editPropId = id;
      S.editMode = mode;
      S.aiFeedback = "";
      S.manualDraft = buildManualDraft(p);
      draw();
      focusActivePropInput();
    }

    function setEditMode(mode) {
      S.editMode = mode;
      draw();
      focusActivePropInput();
    }

    function applyAiChip(chip) {
      S.aiFeedback = S.aiFeedback ? `${S.aiFeedback}；${chip}` : chip;
      draw();
      focusActivePropInput();
    }

    function cancelPropEdit() {
      S.editPropId = null;
      S.aiFeedback = "";
      S.manualDraft = null;
      draw();
    }

    function submitAiRefinement(id) {
      const p = S.proposals.find(x => x.id === id);
      const idea = (document.getElementById("prop-ai-ta")?.value ?? S.aiFeedback).trim();
      if (!p || !idea) return;

      if (p.kind === "mail") {
        if (idea.includes("周五") || idea.includes("婉拒")) {
          p.subject = "Re: 关于合作协议终审排期调整建议";
          p.title = "回复陈明：协商改约周五下午核对终稿";
          p.body = `陈老师您好，\n\n感谢发来修订版 PDF！周四下午这边临时有安排冲突，不知本周五（11月20日）下午 15:00–15:30 是否方便线上过一下第 4.2 条细节？\n\n祝好！`;
        } else {
          p.body = `陈老师您好，\n\n修订版 v3 已妥收。周四（11月19日）14:00–14:45 我们准时线上核对第 4.2 条交付物说明，届时也会同步确认后续细节。\n\n顺颂时祺！`;
        }
      } else if (p.kind === "calendar") {
        if (idea.includes("周五")) {
          p.date = "2026-11-20";
          p.startTime = "15:00";
          p.endTime = idea.includes("30") ? "15:30" : "15:45";
        } else if (idea.includes("30")) {
          p.endTime = "14:30";
        } else if (idea.includes("顺延") || idea.includes("推迟")) {
          p.startTime = "14:30";
          p.endTime = "15:15";
        } else {
          p.date = "2026-11-20";
          p.startTime = "10:00";
          p.endTime = "10:45";
        }
        p.meta = `${p.calendarSource} · 无时段冲突`;
        p.body = `${p.date} ${p.startTime} – ${p.endTime} · ${p.location}${p.notes ? "\n备注：" + p.notes : ""}`;
      } else {
        p.date = idea.includes("周五") ? "2026-11-20" : "2026-11-18";
        p.dueTime = idea.includes("周五") ? "17:30" : "10:00";
        p.body = `截止提醒：${p.date} ${p.dueTime}${p.notes ? "\n备注：" + p.notes : ""}`;
      }

      p.rev += 1; p.updated = true;
      S.editPropId = null;
      S.aiFeedback = "";
      S.manualDraft = null;
      draw();
    }

    function saveManualPropEdit(id) {
      const p = S.proposals.find(x => x.id === id);
      const d = S.manualDraft;
      if (!p || !d) return;

      if (p.kind === "mail") {
        if (d.to.trim()) p.to = d.to.trim();
        if (d.subject.trim()) p.subject = d.subject.trim();
        if (d.body.trim()) p.body = d.body.trim();
        p.meta = `发件箱 ${p.fromAccount} · To ${p.to}`;
      } else if (p.kind === "calendar") {
        p.eventTitle = d.eventTitle.trim() || p.eventTitle;
        p.title = "新增日程：" + p.eventTitle;
        p.date = d.date;
        p.startTime = d.startTime;
        p.endTime = d.endTime;
        p.calendarSource = d.calendarSource;
        p.location = d.location;
        p.notes = d.notes;
        p.meta = p.calendarSource;
        p.body = `${p.date} ${p.startTime} – ${p.endTime} · ${p.location}${p.notes ? "\n备注：" + p.notes : ""}`;
      } else {
        p.todoTitle = d.todoTitle.trim() || p.todoTitle;
        p.title = "新建待办：" + p.todoTitle;
        p.date = d.date;
        p.dueTime = d.dueTime;
        p.listSource = d.listSource;
        p.notes = d.notes;
        p.meta = p.listSource;
        p.body = `截止提醒：${p.date} ${p.dueTime}${p.notes ? "\n备注：" + p.notes : ""}`;
      }

      p.rev += 1; p.updated = true;
      S.editPropId = null;
      S.manualDraft = null;
      draw();
    }

    function getAiChipsForProp(p) {
      if (p.kind === "mail") {
        return ["语气更客气温和", "精简到三句话内", "婉拒周四，改约周五下午", "补充询问第 4.2 条细节"];
      }
      if (p.kind === "calendar") {
        return ["改到周五下午空档", "缩短为 30 分钟", "顺延半小时开始", "改到下周上午并留缓冲"];
      }
      return ["推迟到明早 10:00", "改到周五下班前", "补充优先核对附件备注"];
    }

    /* Shared Refinement Fields Renderer (used in Mobile Full-Screen Editor & Desktop Inline Refinement) */
    function renderPropRefinementBody(p, fullScreenMobile) {

      if (S.editMode === "ai") {
        return `
          <div class="${fullScreenMobile ? 'flex-1 flex flex-col min-h-0 px-4 py-3 gap-3' : 'space-y-2.5 pt-1'}">

            <div style="padding:9px 11px;border-radius:9px;background:var(--surface-2);font-size:12.5px;line-height:1.55" class="shrink-0">
              ${p.kind === "calendar" ? `
                <div style="font-weight:600;color:var(--text)">当前拟定：${esc(p.date)} ${esc(p.startTime)} – ${esc(p.endTime)} · ${esc(p.calendarSource)}</div>

                  + ${esc(c)}

            >${esc(S.aiFeedback)}</textarea>

      // Secondary Mode: 手动编辑（邮件与日程表单结构完全不同，底部多行区域均 flex:1 向下占满）
      if (p.kind === "mail") {
        return `
          <div class="${fullScreenMobile ? 'flex-1 flex flex-col min-h-0 px-4 py-3 gap-2.5' : 'space-y-2.5 pt-1'}">

              <label class="flex items-center gap-2" style="padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)">
                <span style="color:var(--muted);width:44px;flex-shrink:0">收件方</span>
                <input value="${esc(d.to)}" oninput="S.manualDraft.to=this.value" style="flex:1;border:0;background:transparent;outline:none;font-family:var(--font-mono);font-size:12.5px" />
              </label>
              <label class="flex items-center gap-2" style="padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)">
                <span style="color:var(--muted);width:44px;flex-shrink:0">主题</span>
                <input value="${esc(d.subject)}" oninput="S.manualDraft.subject=this.value" style="flex:1;border:0;background:transparent;outline:none;font-size:13px" />
              </label>
            </div>
            <textarea
              id="prop-manual-ta"
              oninput="S.manualDraft.body=this.value"
              rows="${fullScreenMobile ? 8 : 8}"
              style="${fullScreenMobile ? 'flex:1;min-height:0;height:100%;' : 'min-height:190px;'}width:100%;resize:none;padding:12px 14px;border:1px solid var(--line-strong);border-radius:var(--r-input);background:var(--surface);color:var(--text);font-family:var(--font-sans);font-size:${fullScreenMobile ? '15px' : '13.5px'};line-height:1.65;outline:none"
            >${esc(d.body)}</textarea>
          </div>
        `;
      }

      if (p.kind === "calendar") {
        return `
          <div class="${fullScreenMobile ? 'flex-1 flex flex-col min-h-0 px-4 py-3 gap-2.5' : 'space-y-2.5 pt-1'}">
            <div class="grid gap-2 shrink-0" style="font-size:13px">
              <label class="grid gap-1">
                <span style="font-size:11.5px;color:var(--muted)">日程标题</span>
                <input value="${esc(d.eventTitle)}" oninput="S.manualDraft.eventTitle=this.value" style="padding:8px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface)" />
              </label>
              <!-- 手机端日期独占一行，起止时间两列；桌面端三列 -->
              <div class="grid ${fullScreenMobile ? 'grid-cols-2' : 'grid-cols-3'} gap-2">
                <label class="grid gap-1 min-w-0 ${fullScreenMobile ? 'col-span-2' : ''}">
                  <span style="font-size:11.5px;color:var(--muted)">日期</span>
                  <input type="date" value="${esc(d.date)}" oninput="S.manualDraft.date=this.value" style="min-width:0;width:100%;padding:8px 8px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);font-size:12.5px" />

                  <span style="font-size:11.5px;color:var(--muted)">开始</span>
                  <input type="time" value="${esc(d.startTime)}" oninput="S.manualDraft.startTime=this.value" style="min-width:0;width:100%;padding:8px 8px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);font-size:12.5px" />
                </label>
                <label class="grid gap-1">
                  <span style="font-size:11.5px;color:var(--muted)">结束</span>
                  <input type="time" value="${esc(d.endTime)}" oninput="S.manualDraft.endTime=this.value" style="min-width:0;width:100%;padding:8px 8px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);font-size:12.5px" />
                </label>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <label class="grid gap-1">
                  <span style="font-size:11.5px;color:var(--muted)">写入日历</span>
                  <select onchange="S.manualDraft.calendarSource=this.value" style="padding:8px 9px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);font-size:12.5px">
                    <option ${d.calendarSource.includes("Apple") ? "selected" : ""}>Apple 日历</option>
                    <option ${d.calendarSource.includes("CalDAV") ? "selected" : ""}>工作日历</option>
                    <option ${d.calendarSource.includes("本地") ? "selected" : ""}>本地日历</option>
                  </select>
                </label>
                <label class="grid gap-1">
                  <span style="font-size:11.5px;color:var(--muted)">地点 / 会议链接</span>
                  <input value="${esc(d.location)}" oninput="S.manualDraft.location=this.value" style="padding:8px 10px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);font-size:12.5px" />
                </label>
              </div>
            </div>
            <textarea
              id="prop-manual-ta"
              oninput="S.manualDraft.notes=this.value"
              placeholder="日程议程或备注说明…"
              style="${fullScreenMobile ? 'flex:1;min-height:0;height:100%;' : 'min-height:110px;'}width:100%;resize:none;padding:11px 13px;border:1px solid var(--line-strong);border-radius:var(--r-input);background:var(--surface);color:var(--text);font-family:var(--font-sans);font-size:${fullScreenMobile ? '14.5px' : '13.5px'};line-height:1.6;outline:none"
            >${esc(d.notes)}</textarea>
          </div>
        `;
      }

      // Todo manual form
      return `
        <div class="${fullScreenMobile ? 'flex-1 flex flex-col min-h-0 px-4 py-3 gap-2.5' : 'space-y-2.5 pt-1'}">
          <div class="grid gap-2 shrink-0" style="font-size:13px">
            <label class="grid gap-1">
              <span style="font-size:11.5px;color:var(--muted)">待办事项</span>
              <input value="${esc(d.todoTitle)}" oninput="S.manualDraft.todoTitle=this.value" style="padding:8px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface)" />
            </label>
            <div class="grid grid-cols-2 gap-2">
              <label class="grid gap-1">
                <span style="font-size:11.5px;color:var(--muted)">截止日期</span>

              </label>
              <label class="grid gap-1">
                <span style="font-size:11.5px;color:var(--muted)">提醒时间</span>
                <input type="time" value="${esc(d.dueTime)}" oninput="S.manualDraft.dueTime=this.value" style="padding:8px 9px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);font-size:12.5px" />
              </label>
            </div>
          </div>
          <textarea
            id="prop-manual-ta"
            oninput="S.manualDraft.notes=this.value"
            placeholder="补充待办备注…"
            style="${fullScreenMobile ? 'flex:1;min-height:0;height:100%;' : 'min-height:110px;'}width:100%;resize:none;padding:11px 13px;border:1px solid var(--line-strong);border-radius:var(--r-input);background:var(--surface);color:var(--text);font-family:var(--font-sans);font-size:${fullScreenMobile ? '14.5px' : '13.5px'};line-height:1.6;outline:none"
          >${esc(d.notes)}</textarea>
        </div>
      `;
    }

    /* Full-Screen Mobile Proposal Refinement (default: AI polish/reschedule; secondary: structured/full-height manual edit) */
    function renderMobileFullScreenPropEditor(p) {
      return `
        <div class="w-[375px] h-[760px] flex flex-col overflow-hidden is-mobile" style="background:var(--bg)">

            <nav class="view-switch mr-1">
              <button onclick="setEditMode('ai')" class="${S.editMode === 'ai' ? 'active' : ''}">让助理改</button>

            </div>
            <div style="font-size:14px;font-weight:620">${esc(p.title)}</div>
            ${p.warning ? `<div style="margin-top:4px;padding:6px 9px;border-radius:7px;background:var(--warm-soft);color:var(--warm-ink);font-size:12px">${esc(p.warning)}</div>` : ""}

          <footer class="px-4 pt-2.5 pb-3.5 flex items-center gap-2.5 shrink-0" style="border-top:1px solid var(--line);background:var(--bg)">

    function renderDesktopInlineRefinement(p) {
      return `
        <div class="space-y-2.5 pt-1" style="border-top:1px solid var(--line)">
          <div class="flex items-center justify-between gap-2 pt-1">
            <span></span>
            <nav class="view-switch">
              <button onclick="setEditMode('ai')" class="${S.editMode === 'ai' ? 'active' : ''}">让助理改</button>
              <button onclick="setEditMode('manual')" class="${S.editMode === 'manual' ? 'active' : ''}">手动编辑</button>
            </nav>
          </div>
          ${renderPropRefinementBody(p, false)}
          <div class="flex items-center gap-2 pt-1">
            ${S.editMode === "ai" ? `
              <button onclick="submitAiRefinement('${p.id}')" class="primary-button">${refineButtonLabel(p)}</button>

              <button onclick="saveManualPropEdit('${p.id}')" class="primary-button">保存修改</button>

    const doneLabel = p => p.state !== "executed" ? "已忽略" : p.kind === "mail" ? "已发出" : p.kind === "calendar" ? "已写入日历" : "已添加待办";
    const dismissProp = id => `S.proposals.find(x=>x.id==='${id}').state='dismissed';draw()`;

    function renderProposalActions(p, pushRight) {
      return `
        <div class="flex items-center gap-2 flex-wrap">
          <button onclick="requestCommitProp('${p.id}')" class="primary-button" ${canCommit() ? "" : "disabled"}>${primaryCommitLabel(p)}</button>
          <button onclick="openPropEdit('${p.id}', 'ai')" class="secondary-button" ${canSend() ? "" : "disabled"}>${refineButtonLabel(p)}</button>
          <button onclick="openPropEdit('${p.id}', 'manual')" class="text-link-btn" style="color:var(--muted)">手动编辑</button>
          <button onclick="${dismissProp(p.id)}" class="text-link-btn" style="color:var(--muted);${pushRight ? "margin-left:auto" : ""}">忽略</button>
        </div>`;
    }

    /* Inline Proposal Card inside Conversation Stream (uses .interactive-prompt-card) */
    function renderInlineProposal(p) {
      if (p.state !== "pending") {
        return `<section class="interactive-prompt-card">
          <div class="flex items-center gap-2">
            <span class="interactive-prompt-badge done">${p.state === "executed" ? "✓ " : ""}${doneLabel(p)}</span>
            <span style="font-size:13.5px;font-weight:580">${esc(p.title)}</span>
          </div>
        </section>`;
      }
      const editing = S.vp === "desktop" && S.editPropId === p.id;
      return `<section class="interactive-prompt-card is-pending" data-prop="${p.id}">
        <div class="flex items-center gap-2">
          <span class="interactive-prompt-badge">${esc(p.badge)}</span>
          ${p.updated ? `<span style="font-size:11.5px;color:var(--success-ink);font-weight:600">已更新</span>` : ""}
        </div>
        <div style="font-size:14px;font-weight:630">${esc(p.title)}</div>
        <div style="color:var(--muted);font-size:12px">${esc(p.meta)}</div>
        ${p.warning ? `<div style="padding:7px 10px;border-radius:7px;background:var(--warm-soft);color:var(--warm-ink);font-size:12px">${esc(p.warning)}</div>` : ""}
        ${editing ? renderDesktopInlineRefinement(p) : `
          <pre style="margin:0;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);white-space:pre-wrap;font-family:var(--font-sans);font-size:13px;line-height:1.6">${esc(p.body)}</pre>
          ${renderProposalActions(p, true)}
        `}
      </section>`;
    }

    /* Full-Page Proposal List — 两端都只从待批提醒条进入 */
    function renderHairlineProposalsPage() {
      const pList = pendings();
      const doneList = S.proposals.filter(p => p.state !== "pending");
      return `
        <div>
          ${S.vp === "desktop" ? `
            <button onclick="S.view='conversation';draw()" class="text-link-btn inline-flex items-center gap-1" style="color:var(--muted);margin-bottom:10px">${ic.back.replace('width="20" height="20"', 'width="15" height="15"')}<span>返回对话</span></button>
          ` : ""}
          <div class="settings-hairline-heading">
            <span>待确认</span>
            <span>${pList.length}</span>
          </div>
          ${pList.length === 0 ? `<p style="padding:36px 0;text-align:center;color:var(--muted);font-size:13.5px">没有待确认的事项</p>` : ""}
          ${pList.map(p => `
            <div class="mobile-settings-row space-y-2.5">
              <div class="flex items-center gap-2 text-xs">
                <span style="color:var(--accent-ink);font-weight:650">${esc(p.badge)}</span>
                <span style="color:var(--muted)">${esc(p.meta)}</span>
                ${p.updated ? `<span style="color:var(--success-ink);font-weight:600">已更新</span>` : ""}
              </div>
              <div style="font-size:15px;font-weight:620">${esc(p.title)}</div>
              ${p.warning ? `<div style="padding:7px 10px;border-radius:7px;background:var(--warm-soft);color:var(--warm-ink);font-size:12.5px">${esc(p.warning)}</div>` : ""}
              ${S.vp === "desktop" && S.editPropId === p.id ? renderDesktopInlineRefinement(p) : `
                <pre style="margin:0;padding:6px 0;white-space:pre-wrap;font-family:var(--font-sans);font-size:14px;line-height:1.65;color:var(--text)">${esc(p.body)}</pre>
                ${renderProposalActions(p, true)}
              `}
            </div>
          `).join("")}

          ${doneList.length ? `
            <div class="settings-hairline-heading" style="margin-top:26px">
              <span>已处理</span>
              <span>${doneList.length}</span>
            </div>
            ${doneList.map(p => `
              <div class="mobile-settings-row" style="opacity:0.72">
                <div style="font-size:14px;font-weight:540">${esc(p.title)}</div>
                <div style="font-size:12px;color:var(--muted)">${doneLabel(p)} · ${esc(p.meta)}</div>
              </div>
            `).join("")}
          ` : ""}
        </div>
      `;
    }

    function renderAuthFailLine() {
      if (S.scenario !== "authfail") return "";
      return `<div class="assistant-status-line is-danger">${ic.alert}<span>浙大邮箱登录已失效，新邮件暂停同步。</span><button onclick="S.view='settings';S.settingsSection='accounts';draw()" class="text-link-btn">重新登录</button></div>`;
    }

    /* Mail List — 行样式映射到现有 .mobile-settings-row / .settings-hairline-heading，不新造类名 */
    function renderHairlineMailPage() {
      const enabled = S.accounts.filter(a => a.enabled);
      const list = visibleMails().filter(m => S.mailAccountFilter === "all" || m.accountKey === S.mailAccountFilter);
      const tab = (key, label) => `<button onclick="S.mailAccountFilter='${key}';draw()" style="border:0;background:transparent;padding:0;white-space:nowrap;cursor:pointer;color:${S.mailAccountFilter === key ? 'var(--text)' : 'var(--muted)'};font-weight:${S.mailAccountFilter === key ? '650' : '500'}">${esc(label)}</button>`;
      return `
        <div>
          ${renderAuthFailLine()}
          ${isOffline() ? `<div class="assistant-status-line">${ic.alert}<span>电脑离线，显示的是 09:30 的缓存。</span></div>` : ""}
          <div class="settings-hairline-heading">
            <div class="flex items-center gap-4">
              ${tab("all", "全部")}
              ${enabled.map(a => tab(a.key, accLabel(a))).join("")}
            </div>
          </div>

          ${S.scenario === "loading" ? [0, 1, 2].map(() => `
            <div class="mobile-settings-row space-y-2.5" aria-hidden="true">
              <div class="skeleton-line" style="width:38%"></div>
              <div class="skeleton-line" style="width:72%;height:14px"></div>
              <div class="skeleton-line" style="width:90%"></div>
            </div>
          `).join("") + `<p role="status" style="padding:12px 0;color:var(--muted);font-size:12.5px;text-align:center">正在同步邮件…</p>` : ""}

          ${S.scenario === "empty" ? `<p role="status" style="padding:48px 0;text-align:center;color:var(--muted);font-size:13.5px">还没有新邮件</p>` : ""}

          ${list.map(m => `
            <article class="mobile-settings-row space-y-1.5">
              <header class="flex items-center justify-between gap-3" style="font-size:11.5px;color:var(--muted)">
                <span class="inline-flex items-center gap-1.5 min-w-0">${ic.mail}<span class="truncate">${esc(accLabel(S.accounts.find(a => a.key === m.accountKey) || { key: m.accountKey, user: m.accountUser }))} · ${esc(m.status)}</span></span>
                <time style="font-family:var(--font-num)">${esc(m.time)}</time>
              </header>
              <h3 style="margin:2px 0 0;font-size:15.5px;font-weight:600;line-height:1.45">${esc(m.subject)}</h3>
              <div style="font-size:12.5px;color:var(--muted)">${esc(m.from)}</div>
              <p style="margin:0;font-size:14px;line-height:1.65">${esc(m.analysis)}</p>
              ${m.attachments.length ? `
                <div class="pt-1 space-y-1">
                  ${m.attachments.map(att => `
                    <div class="flex items-center justify-between gap-3 py-1.5 px-2.5 rounded-lg" style="background:var(--surface-2);font-size:12.5px">
                      <span class="inline-flex items-center gap-2 min-w-0">${ic.file}<span class="truncate">${esc(att.name)}</span><span style="color:var(--muted);font-family:var(--font-mono);flex:none">${att.size}</span></span>
                      <button onclick='S.previewFile={name:${JSON.stringify(att.name)},size:${JSON.stringify(att.size)},bytes:${att.bytes},mime:${JSON.stringify(att.mime)},confirmed:${att.bytes <= 1048576}};draw()' class="text-link-btn shrink-0" ${isOffline() ? "disabled" : ""}>预览</button>
                    </div>
                  `).join("")}
                </div>
              ` : ""}
              ${renderMailActions(m)}
            </article>
          `).join("")}
        </div>
      `;
    }

    /* 邮件两个动作：两处统一顺序（讨论在前）与字号（13px 文字链接） */
    function renderMailActions(m) {
      return `
        <div class="flex items-center gap-4 pt-1">
          <button onclick="selectMailForChat('${m.id}')" class="text-link-btn" ${canSend() ? "" : "disabled"}>讨论此邮件</button>
          <button onclick="S.sheetMailId='${m.id}';draw()" class="text-link-btn" style="color:var(--muted)">查看原文</button>
        </div>`;
    }

    /* Agenda & Todos */
    function renderHairlineAgendaPage() {
      const events = visibleEvents();
      const todos = visibleTodos();
      return `
        <div class="space-y-7">
          ${isOffline() ? `<div class="assistant-status-line">${ic.alert}<span>电脑离线，显示的是 09:30 的缓存，暂不能修改。</span></div>` : ""}
          <div>
            <div class="settings-hairline-heading">
              <span>日程</span>
            </div>
            ${events.length ? "" : `<p style="padding:20px 0;color:var(--muted);font-size:13.5px">今天没有日程</p>`}
            ${events.map(e => `
              <div class="mobile-settings-row flex items-center justify-between gap-3">
                <div class="space-y-0.5 min-w-0">
                  <div style="font-size:14.5px;font-weight:580">${esc(e.title)}</div>
                  <div style="font-size:12.5px;color:var(--muted)">${esc(e.time)} · ${esc(e.meta)}</div>
                </div>
                <button onclick='referenceForReschedule(${JSON.stringify({ id: e.id, title: e.title, time: e.time })})' class="text-link-btn shrink-0" ${canSend() ? "" : "disabled"}>改期</button>
              </div>
            `).join("")}
          </div>

          <div>
            <div class="settings-hairline-heading">
              <span>待办</span>
              <span>${todos.filter(t => !t.done).length ? `${todos.filter(t => !t.done).length} 未完成` : ""}</span>
            </div>
            ${todos.length ? "" : `<p style="padding:20px 0;color:var(--muted);font-size:13.5px">没有未完成的待办</p>`}
            ${todos.map(t => `
              <label class="mobile-settings-row flex items-start gap-3 ${t.writing || isOffline() ? "" : "cursor-pointer"}">
                <input type="checkbox" ${t.done ? "checked" : ""} ${t.writing || isOffline() ? "disabled" : ""} onchange="toggleTodo('${t.id}')" style="width:18px;height:18px;margin-top:3px;accent-color:var(--accent)" />
                <div class="flex-1 min-w-0">
                  <div style="font-size:14.5px;font-weight:540;${t.done ? 'text-decoration:line-through;opacity:0.55' : ''}">${esc(t.title)}</div>
                  <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${t.writing ? "正在同步…" : esc(t.meta)}</div>
                  ${S.todoNotice?.id === t.id ? `<div role="status" style="margin-top:6px;font-size:12.5px;color:var(--warm-ink)">${esc(S.todoNotice.text)}</div>` : ""}
                </div>
              </label>
            `).join("")}
          </div>
        </div>
      `;
    }

    /* Settings (matches DesktopSettings 2-col shell on Desktop & MobileSettings on Mobile) */
    function renderHairlineSettings(isMobile) {
      const accountsBlock = `
        <div>
          <div class="settings-hairline-heading">
            <span>收件邮箱</span>
            <button onclick="S.addingAcc=!S.addingAcc;draw()" class="text-link-btn" style="font-size:12px">+ 添加邮箱</button>
          </div>
          ${S.addingAcc ? `
            <div class="mobile-settings-row space-y-3" style="max-width:480px">
              <div class="grid gap-2 text-xs">
                <label class="grid gap-1"><span style="color:var(--muted)">收信服务器</span><input id="acc-h" placeholder="imap.qq.com" style="padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--r-input);background:var(--surface)" /></label>
                <label class="grid gap-1"><span style="color:var(--muted)">邮箱地址</span><input id="acc-u" placeholder="name@foxmail.com" style="padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--r-input);background:var(--surface)" /></label>
                <label class="grid gap-1"><span style="color:var(--muted)">应用专用密码（只保存在本机钥匙串）</span><input type="password" style="padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--r-input);background:var(--surface)" /></label>
              </div>
              <div class="flex gap-2">
                <button onclick="S.accounts.push({key:'k'+Date.now(),user:document.getElementById('acc-u').value||'vip@foxmail.com',host:document.getElementById('acc-h').value||'imap.qq.com',port:993,enabled:true});S.addingAcc=false;draw()" class="primary-button">保存并启用</button>
                <button onclick="S.addingAcc=false;draw()" class="secondary-button">取消</button>
              </div>
            </div>
          ` : ""}
          ${S.accounts.map(a => {
            const failed = S.scenario === "authfail" && a.key === "work";
            const status = !a.enabled ? "已停用" : isOffline() ? "电脑离线" : failed ? "登录已失效，新邮件暂停同步" : "已连接 · 09:24 同步";
            return `
            <div class="mobile-settings-row flex items-center justify-between gap-3">
              <div class="min-w-0">
                <div style="font-size:14.5px;font-weight:540;overflow-wrap:anywhere">${esc(a.user)}</div>
                <div style="font-size:12.5px;margin-top:2px;color:${failed ? 'var(--danger-ink)' : 'var(--muted)'}">${status}</div>
              </div>
              ${failed
                ? `<button onclick="S.scenario='normal';draw()" class="primary-button shrink-0">重新登录</button>`
                : `<button onclick="x=S.accounts.find(i=>i.key==='${a.key}');x.enabled=!x.enabled;draw()" class="secondary-button shrink-0" ${isOffline() ? "disabled" : ""}>${a.enabled ? "停用" : "启用"}</button>`}
            </div>`;
          }).join("")}
        </div>
      `;

      const sessionStatus = { rebind: "原会话已归档或删除", unavailable: "暂时连不上，恢复后自动重连", offline: "电脑离线" }[S.scenario] || "已连接 · 最近活动 09:24";
      const bindingBlock = `
        <div>
          <div class="settings-hairline-heading"><span>助理会话</span></div>
          <div class="mobile-settings-row flex items-center justify-between gap-3">
            <div class="min-w-0">
              <div style="font-size:14.5px;font-weight:540">个人助理</div>
              <div style="font-size:12.5px;color:${isRebind() ? 'var(--danger-ink)' : 'var(--muted)'};margin-top:2px">${sessionStatus}</div>
            </div>
            <button class="secondary-button shrink-0" ${isOffline() ? "disabled" : ""}>${isRebind() ? "重新绑定" : "更换会话"}</button>
          </div>
        </div>
      `;

      if (isMobile) return `<div class="space-y-7">${accountsBlock}${bindingBlock}</div>`;
      return `
        <div class="desktop-settings-shell">
          <nav class="settings-sections">
            <button onclick="S.settingsSection='accounts';draw()" class="${S.settingsSection === 'accounts' ? 'active' : ''}">收件邮箱</button>
            <button onclick="S.settingsSection='binding';draw()" class="${S.settingsSection === 'binding' ? 'active' : ''}">助理会话</button>
          </nav>
          <div>${S.settingsSection === "accounts" ? accountsBlock : bindingBlock}</div>
        </div>
      `;
    }

    /* 首屏：未初始化 */
    function renderInitScreen() {
      return `
        <div class="flex flex-col items-center text-center" style="padding:${S.vp === "mobile" ? "72px 8px" : "96px 0"};gap:14px">
          <span style="display:grid;width:44px;height:44px;place-items:center;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink)">${ic.mail.replace('width="15" height="15"', 'width="22" height="22"')}</span>
          <h2 style="margin:0;font-size:18px;font-weight:650">设置个人助理</h2>
          <p style="margin:0;max-width:380px;color:var(--muted);font-size:13.5px;line-height:1.7">助理在单独的文件夹里工作，碰不到你的项目。发邮件、改日程和待办前都会先问你。</p>
          <button onclick="runInit()" class="primary-button" style="min-width:160px;margin-top:6px" ${S.initializing ? "disabled" : ""}>${S.initializing ? "正在准备…" : "开始设置"}</button>
          <button class="text-link-btn" style="color:var(--muted)">改用已有会话</button>
        </div>`;
    }

    /* 会话层状态条：需重新绑定 / 不可用 / 离线 / 邮箱登录失效 */
    function renderSessionStatusLines() {
      if (isRebind()) return `
        <div class="assistant-status-line is-danger">${ic.alert}<span>原来的助理会话已被归档或删除，邮件仍在照常收取。</span>
          <button class="text-link-btn">新建会话</button><button class="text-link-btn">选择已有会话</button>
        </div>`;
      if (S.scenario === "unavailable") return `<div class="assistant-status-line is-warn">${ic.alert}<span>暂时连不上助理会话，恢复后会自动重连，期间新邮件照常收取。</span></div>`;
      return "";
    }

    function renderConversationStage(isMobile) {
      const stream = visibleStream();
      return `
        <div>
          ${renderSessionStatusLines()}
          ${renderAuthFailLine()}
          ${isOffline() ? `<div class="assistant-status-line">${ic.alert}<span>电脑离线，显示的是 09:30 的缓存。</span></div>` : ""}
          ${stream.length ? "" : `<p style="padding:64px 0;text-align:center;color:var(--muted);font-size:13.5px">还没有对话</p>`}
          <div class="space-y-5">
            ${stream.map(item => {
              if (item.kind === "mail-card") {
                const m = S.mails.find(x => x.id === item.mailId);
                if (!m) return "";
                const acc = S.accounts.find(a => a.key === m.accountKey) || { key: m.accountKey, user: m.accountUser };
                return `
                  <article class="interactive-prompt-card" style="margin-top:0">
                    <header class="flex items-center justify-between gap-2" style="font-size:11.5px;color:var(--muted)">
                      <span class="inline-flex items-center gap-1.5">${ic.mail}<span>${esc(accLabel(acc))}</span></span>
                      <time style="font-family:var(--font-num)">${esc(m.time)}</time>
                    </header>
                    <div style="font-size:15px;font-weight:620">${esc(m.subject)}</div>
                    <div style="font-size:12.5px;color:var(--muted)">${esc(m.from)}</div>
                    <div style="font-size:13.5px;line-height:1.6">${esc(m.preview)}</div>
                    ${m.attachments.length ? `
                      <div class="flex flex-wrap gap-2">
                        ${m.attachments.map(att => `
                          <button onclick='S.previewFile={name:${JSON.stringify(att.name)},size:${JSON.stringify(att.size)},bytes:${att.bytes},mime:${JSON.stringify(att.mime)},confirmed:${att.bytes <= 1048576}};draw()' class="secondary-button !min-h-[30px] !py-1 !px-2.5 !text-xs" ${isOffline() ? "disabled" : ""}>
                            ${ic.file}<span>${esc(att.name)} · ${att.size}</span>
                          </button>
                        `).join("")}
                      </div>
                    ` : ""}
                    ${renderMailActions(m)}
                  </article>
                `;
              }
              if (item.kind === "user") {
                return `
                  <div class="flex justify-end">
                    <div class="conversation-bubble space-y-1.5">
                      ${item.refSubject ? `<div style="font-size:12px;color:var(--muted)">引用：${esc(item.refSubject)}</div>` : ""}
                      ${item.uploads?.length ? `<div class="flex flex-wrap gap-1.5">${item.uploads.map(u => `<span style="padding:2px 8px;border-radius:6px;background:var(--surface-2);font-size:12px">${esc(u.name)}</span>`).join("")}</div>` : ""}
                      <div>${esc(item.text)}</div>
                    </div>
                  </div>
                `;
              }
              if (item.kind === "assistant") {
                const props = (item.proposalIds || []).map(id => S.proposals.find(p => p.id === id)).filter(Boolean);
                return `
                  <div class="space-y-2.5">
                    <div class="assistant-prose">${md(item.text)}</div>
                    ${item.outputFile ? `
                      <div class="mobile-settings-row flex items-center justify-between gap-3" style="border-top:1px solid var(--line)">
                        <div class="flex items-center gap-2.5 min-w-0">
                          <span style="width:34px;height:28px;border-radius:6px;background:var(--surface-2);display:inline-grid;place-items:center;color:var(--muted)">${ic.file}</span>
                          <div class="min-w-0">
                            <div class="truncate" style="font-size:13.75px;font-weight:580">${esc(item.outputFile.name)}</div>
                            <div style="font-size:11.5px;color:var(--muted)">${item.outputFile.size}</div>
                          </div>
                        </div>
                        <button onclick='S.previewFile={name:${JSON.stringify(item.outputFile.name)},size:${JSON.stringify(item.outputFile.size)},bytes:${item.outputFile.bytes},mime:"text/csv",text:${JSON.stringify(item.outputFile.text)},confirmed:true};draw()' class="secondary-button shrink-0">预览</button>
                      </div>
                    ` : ""}
                    ${props.map(p => renderInlineProposal(p)).join("")}
                  </div>
                `;
              }
              return "";
            }).join("")}
          </div>
        </div>
      `;
    }

    /* 待批提醒条：放在顶栏下、滚动区外；是否显示由 syncDock() 决定 */
    function renderPendingDock(isMobile) {
      const n = pendings().length;
      if (!n) return "";
      const open = isMobile ? "S.mobileScreen='proposals-page';draw()" : "S.view='proposals';draw()";
      return `
        <div id="pending-dock" class="permission-dock-wrap ${isMobile ? "is-mobile" : ""}" hidden>
          <button onclick="${open}" class="permission-dock">
            <span class="permission-dock-icon">${ic.alert}</span>

            </div>
          </div>
        ` : ""}
      `;
    }

    function renderAssistantTabs(isMobile) {
      const mailN = pendingMailCount();
      return `
        <nav class="view-switch" aria-label="助理视图">
          <button onclick="S.view='conversation';draw()" class="${S.view === 'conversation' ? 'active' : ''}" ${sessionUsable() ? "" : "disabled"}>对话</button>
          <button onclick="S.view='mail';draw()" class="${S.view === 'mail' ? 'active' : ''}">收件${!isMobile && mailN ? ` <b>${mailN}</b>` : ""}</button>
          <button onclick="S.view='agenda';draw()" class="${S.view === 'agenda' ? 'active' : ''}">日程</button>
        </nav>`;
    }

    function renderStageBody(isMobile) {
      if (isUninit()) return renderInitScreen();
      return `
        ${S.view === "conversation" ? renderConversationStage(isMobile) : ""}
        ${S.view === "proposals" ? renderHairlineProposalsPage() : ""}
        ${S.view === "mail" ? renderSessionStatusLines() + renderHairlineMailPage() : ""}
        ${S.view === "agenda" ? renderSessionStatusLines() + renderHairlineAgendaPage() : ""}
        ${S.view === "settings" ? renderHairlineSettings(isMobile) : ""}`;
    }

    const showComposer = () => !isUninit() && ["conversation", "mail", "agenda"].includes(S.view);

    function renderDesktop() {
      const pCount = canCommit() ? pendings().length : 0;
      return `
        <section class="desktop-session-layout ${S.sidebarCollapsed ? 'is-sidebar-collapsed' : ''}">
          ${!S.sidebarCollapsed ? `
            <aside class="desktop-session-sidebar">
              <div class="desktop-sidebar-heading">
                <div class="inline-flex items-center gap-2 min-w-0">
                  <i class="m-status-dot ${isOffline() ? "" : "is-online"}"></i>
                  <strong class="truncate" style="font-size:13.5px;font-weight:600">MacBook Pro</strong>
                  ${isOffline() ? `<span style="font-size:12px;color:var(--muted)">离线</span>` : ""}
                </div>
                <button onclick="S.desktopArea='project';draw()" class="icon-button" title="新建会话">${ic.compose}</button>
              </div>

              <div class="px-2.5 pb-2 space-y-1.5">
                <button onclick="S.desktopArea='assistant';draw()" class="sidebar-assistant-row ${S.desktopArea === 'assistant' ? 'active' : ''}">
                  <span class="inline-flex items-center gap-2">
                    <span style="color:${S.desktopArea === 'assistant' ? 'var(--accent-ink)' : 'var(--muted)'}">${ic.mail}</span>
                    <span>助理</span>
                  </span>
                  ${pCount > 0 ? `<span class="inline-flex items-center gap-1" style="font-family:var(--font-mono);font-size:11.5px;font-weight:650" aria-label="${pCount} 项待确认"><i style="width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block"></i>${pCount}</span>` : ""}
                </button>
                <div class="session-search">${ic.search}<span>搜索项目或会话</span></div>
              </div>

              <div class="flex-1 overflow-y-auto b-scroll px-2 py-1 space-y-1">
                <div class="px-2 py-1" style="font-size:11px;font-weight:600;color:var(--muted)">项目</div>
                <div class="px-2 py-1" style="font-size:13px;font-weight:650">▾ claude-desktop-bridge</div>
                <button onclick="S.desktopArea='project';S.projectTitle='fix(desktop): prevent background-task catalog OOM';draw()" class="flat-session-row ${S.desktopArea === 'project' && S.projectTitle.includes('OOM') ? 'active' : ''}">
                  <span class="truncate">fix(desktop): prevent OOM</span>
                </button>
                <button onclick="S.desktopArea='project';S.projectTitle='refactor: complete target architecture & v3 UI';draw()" class="flat-session-row ${S.desktopArea === 'project' && S.projectTitle.includes('v3') ? 'active' : ''}">
                  <span class="truncate">refactor: v3 desktop/mobile UI</span>
                </button>
              </div>

              <footer class="px-3 py-2.5 flex items-center justify-between" style="border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)">
                <span class="inline-flex items-center gap-2">${ic.settings}<span>设置</span></span>
                <span style="font-family:var(--font-mono);font-size:11px">1.3.5</span>
              </footer>
            </aside>
          ` : ""}

          ${S.desktopArea === "project" ? `
            <div class="flex flex-col min-w-0 min-h-0">
              <header class="m-header is-embedded">
                <button onclick="S.sidebarCollapsed=!S.sidebarCollapsed;draw()" class="icon-button" title="切换侧栏">${ic.sidebar}</button>
                <div class="m-header-copy">
                  <h1 class="truncate">${esc(S.projectTitle)}</h1>
                  <span class="m-host-chip"><span>GPT-6.1-Sol</span>${ic.chevDown}</span>
                </div>
                <div class="view-switch">
                  <button class="active">对话</button>
                  <button>成果 <b>3</b></button>
                </div>
              </header>
              <div class="centered-scroll-stage flex flex-col items-center justify-center text-center space-y-3">
                <div style="font-size:15px;font-weight:600">普通项目会话</div>
                <button onclick="S.desktopArea='assistant';draw()" class="primary-button">进入助理</button>
              </div>
            </div>
          ` : readerOpen() ? renderReader(false) : `
            <div class="flex flex-col min-w-0 min-h-0">
              <header class="m-header is-embedded">
                <button onclick="S.sidebarCollapsed=!S.sidebarCollapsed;draw()" class="icon-button" title="切换侧栏">${ic.sidebar}</button>
                <div class="m-header-copy">
                  <h1>助理</h1>
                  ${sessionUsable() ? `<span class="m-host-chip"><span>Claude Opus 4.6</span>${ic.chevDown}</span>` : ""}
                </div>
                ${isUninit() ? "" : `
                  <div class="flex items-center gap-1.5">
                    ${renderAssistantTabs(false)}
                    <button onclick="S.view=S.view==='settings'?'conversation':'settings';draw()" class="icon-button ${S.view === 'settings' ? 'active' : ''}" title="助理设置" aria-label="助理设置">${ic.settings}</button>
                    <button onclick="draw()" class="icon-button" title="刷新" aria-label="刷新" ${isOffline() ? "disabled" : ""}>${ic.refresh}</button>
                  </div>
                `}
              </header>

              ${isUninit() ? "" : renderPendingDock(false)}
              <div id="assistant-stage" class="centered-scroll-stage b-scroll" onscroll="syncDock()">
                ${renderStageBody(false)}
              </div>

              ${showComposer() ? renderPersistentComposer(false) : ""}
            </div>
          `}
          ${renderSheets(true)}
        </section>
      `;
    }

    function renderMobile() {
      const pCount = canCommit() ? pendings().length : 0;
      const editingProp = S.editPropId ? S.proposals.find(x => x.id === S.editPropId && x.state === "pending") : null;
      if (editingProp) {
        return renderMobileFullScreenPropEditor(editingProp);
      }
      if (readerOpen()) return renderReader(true);

      if (S.mobileScreen === "home-catalog") {
        return `
          <div class="w-[375px] h-[760px] flex flex-col overflow-hidden is-mobile">
            <div class="mobile-drawer-topbar">
              <button class="drawer-host-switcher">
                <i class="m-status-dot ${isOffline() ? "" : "is-online"}"></i>
                <span>MacBook Pro</span>
                ${ic.chevDown}
              </button>
              <button onclick="S.mobileScreen='assistant';draw()" class="drawer-assistant-capsule">
                <span style="color:var(--accent-ink)">${ic.mail}</span>
                <span>助理</span>
                ${pCount ? `<span class="inline-flex items-center gap-1 ml-auto" style="font-family:var(--font-mono);font-size:12px;font-weight:650" aria-label="${pCount} 项待确认"><i style="width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block"></i>${pCount}</span>` : ""}
              </button>
              <button class="icon-button" style="width:36px;height:36px" aria-label="新建会话">${ic.compose}</button>
            </div>

            <div class="px-2.5 pb-2">
              <div class="session-search" style="min-height:40px;font-size:15px">${ic.search}<span>搜索项目或会话</span></div>
            </div>

            <div class="flex-1 overflow-y-auto b-scroll px-2.5 py-1 space-y-1">
              <div class="px-2 py-1 flex justify-between" style="font-size:12px;font-weight:600;color:var(--muted)"><span>项目</span><span>+ 分组 · 排序</span></div>
              <div class="px-1.5 py-2" style="font-size:16px;font-weight:700">▾ claude-desktop-bridge <span style="font-size:12px;font-weight:500;color:var(--muted)">2</span></div>
              <div class="pl-4 space-y-0.5">
                <div class="py-2.5 px-2" style="font-size:15.5px;font-weight:540">fix(desktop): prevent background-task OOM</div>
                <div class="py-2.5 px-2" style="font-size:15.5px;font-weight:540">refactor: complete target architecture & v3 UI</div>
              </div>
            </div>

            <footer class="px-3 py-2.5 flex items-center justify-between" style="border-top:1px solid var(--line);font-size:14.5px;color:var(--muted)">
              <div class="flex gap-4"><span style="padding:4px 6px">电脑</span><span style="padding:4px 6px">设置</span></div>
              <span style="font-size:12px;font-family:var(--font-mono)">1.3.5</span>
            </footer>
          </div>
        `;
      }

      if (S.mobileScreen === "proposals-page") {
        return `
          <div class="w-[375px] h-[760px] flex flex-col overflow-hidden is-mobile">
            <header class="m-header is-mobile">
              <button onclick="S.mobileScreen='assistant';draw()" class="icon-button" aria-label="返回">${ic.back}</button>
              <div class="m-header-copy"><h1>待确认</h1></div>
            </header>
            <div class="centered-scroll-stage is-mobile b-scroll">
              ${renderHairlineProposalsPage()}
            </div>
            ${renderSheets(false)}
          </div>
        `;
      }

      return `
        <div class="w-[375px] h-[760px] flex flex-col overflow-hidden is-mobile">
          <header class="m-header is-mobile">
            <button onclick="S.mobileScreen='home-catalog';draw()" class="icon-button" aria-label="返回会话列表">${ic.back}</button>
            <div class="m-header-copy"><h1>助理</h1></div>
            ${isUninit() ? "" : `
              <div class="flex items-center gap-1 pr-1">
                ${renderAssistantTabs(true)}
                <button onclick="S.view=S.view==='settings'?'conversation':'settings';draw()" class="icon-button ${S.view === 'settings' ? 'active' : ''}" style="width:36px;height:36px" aria-label="助理设置">${ic.settings}</button>
              </div>
            `}
          </header>

          ${isUninit() ? "" : renderPendingDock(true)}
          <div id="assistant-stage" class="centered-scroll-stage is-mobile b-scroll" onscroll="syncDock()">
            ${renderStageBody(true)}
          </div>

          ${showComposer() ? renderPersistentComposer(true) : ""}
          ${renderSheets(false)}
        </div>
      `;
    }

    function draw() {
      const root = document.getElementById("root-frame");
      root.setAttribute("data-theme", S.theme);
      root.setAttribute("data-theme-family", S.family);
      root.className = S.vp === "desktop"
        ? "b-app relative overflow-hidden shadow-xl w-full max-w-[1100px] rounded-xl"
        : "b-app relative overflow-hidden shadow-2xl rounded-[26px]";
      root.innerHTML = S.vp === "desktop" ? renderDesktop() : renderMobile();
      syncDock();

      const on = "px-2.5 py-1 rounded-md font-semibold bg-[var(--card)] text-[var(--foreground)] shadow-sm cursor-pointer";
      const off = "px-2.5 py-1 rounded-md font-medium text-[var(--muted-foreground)] cursor-pointer";
      document.getElementById("vp-desktop").className = S.vp === "desktop" ? on : off;
      document.getElementById("vp-mobile").className = S.vp === "mobile" ? on : off;
      document.getElementById("fam-sunstone").className = S.family === "sunstone" ? on : off;
      document.getElementById("fam-apple").className = S.family === "apple" ? on : off;
      document.getElementById("scenario").value = S.scenario;
    }

    window.addEventListener("themechange", () => {
      S.theme = document.documentElement.classList.contains("light") ? "light" : "dark";
      draw();
    });

    draw();
  </script>
</body>
</html>
